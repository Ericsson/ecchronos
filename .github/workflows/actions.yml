name: Test report

on:
  workflow_dispatch:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

env:
  MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

permissions: read-all

jobs:
  python-unit-tests:
    # The cluster-free ecctool unit tests. They need neither Java, Maven nor Docker, so they run once per
    # workflow run in their own job instead of in every entry of the matrix below.
    # --noconftest is required: conftest.py imports global_variables.py, which needs the cluster test environment.
    # Keep the command in sync with the python-unit suite in scripts/run-ci.sh and with docs/TESTS.md.
    name: "Python unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install black
        run: python -m pip install black==24.10.0

      - name: Run black in the check mode
        run: black --check --verbose --line-length 120 ./ecchronos-binary/src

      - name: Install pytest
        run: python -m pip install pytest==9.2.0

      - name: Run the cluster-free ecctool unit tests
        working-directory: ecchronos-binary
        run: python -m pytest --noconftest -p no:cacheprovider -v src/test/bin/test_ecctool_*.py src/test/bin/test_rest_timeout.py

  warm-maven-cache:
    # Downloads all Maven dependencies once and saves ~/.m2/repository, so the matrix jobs below only restore it
    # instead of each hitting Maven Central at the same time (HTTP 429 Too Many Requests).
    #
    # NOTE: this job runs on a single JDK (17) on purpose. The JDK version does not affect which dependencies
    # Maven resolves: no profile is activated by JDK version, and java.version only selects the bytecode target.
    # The cache is therefore shared by all JDKs in the matrix below, including any added later.
    # If a <jdk> profile activation is ever added to a pom.xml, add the JDK to this job and to the cache key.
    name: "Warm Maven cache"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: build-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ runner.os }}-maven-

      # All profiles used by the matrix are activated so their dependencies and plugins are downloaded too.
      # The Jolokia agent is fetched by a dependency:copy execution (not a declared dependency), so go-offline
      # does not see it and it is resolved explicitly.
      # This reduces, but does not eliminate, downloads in the matrix jobs: some artifacts are only resolved
      # when a plugin runs (e.g. the surefire JUnit provider) and are still fetched there.
      # Retries wait between attempts, since an immediate retry does not help against rate limiting.
      - name: Resolve all dependencies
        run: |
          for i in 1 2 3 4 5; do
            mvn -B dependency:go-offline \
              -P build-cassandra-test-jar,standalone-integration-tests,python-integration-tests,topology-integration-tests,multi-agent-datacenter-aware-integration-tests,incremental-repair-integration-tests \
              && mvn -B dependency:copy@copy-jolokia-agent -pl cassandra-test-image \
              && exit 0
            echo "Attempt $i failed, waiting $((i * 30))s before retrying"
            sleep $((i * 30))
          done
          exit 1

  tests:
    needs: warm-maven-cache
    # Each job runs on JDK ${{ matrix.java }} and compiles to the matching
    # bytecode target (-Djava.version=${{ matrix.java }}). Runtime and target are
    # paired, so we test exactly: JDK 17 -> target 17 and JDK 21 -> target 21.
    name: "${{ matrix.suite.name }} - Java ${{ matrix.java }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        suite:
          - name: "Unit tests"
            goals: 'test jacoco:report'
          - name: "Style check"
            goals: 'test-compile com.mycila:license-maven-plugin:check pmd:pmd pmd:cpd pmd:check pmd:cpd-check javadoc:jar'
          - name: "Standalone integration 4.1"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=4.1 -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Standalone integration 5.0"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Python integration"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Topology integration"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "DatacenterAware Multi-Agent integration tests"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Incremental Repair integration tests"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Standalone integration 5.0"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Jolokia Python integration"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Python integration - PEM"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Topology integration"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Topology integration - PEM"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia DatacenterAware Multi-Agent integration tests"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia DatacenterAware Multi-Agent integration tests - PEM"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Incremental Repair integration tests"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Incremental Repair integration tests - PEM"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Restore only: the cache is saved by the warm-maven-cache job (shared by all JDKs).
      - name: Restore local Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: build-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ runner.os }}-maven-

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: install dependencies
        run: mvn install -Pbuild-cassandra-test-jar -DskipTests=true

      - name: Set memory limits
        run: |
          echo "MAX_HEAP_SIZE=1536M" >> $GITHUB_ENV
          echo "HEAP_NEWSIZE=200M" >> $GITHUB_ENV
          echo "MAVEN_OPTS=$MAVEN_OPTS -Xmx1g" >> $GITHUB_ENV

      - name: Set up Docker Compose
        uses: KengoTODA/actions-setup-docker-compose@b09fb2b902df45b91982bc46858188f2a714ee5f # v1.2.11
        with:
          version: '2.31.0'

      # Runs on JDK ${{ matrix.java }}; -Djava.version sets the matching bytecode
      # target. net.bytebuddy.experimental=true lets Mockito/ByteBuddy run on JDK 21.
      - run: mvn $MAVEN_GOALS -Djava.version=$JAVA_VERSION -Dnet.bytebuddy.experimental=true -B
        id: tests
        env:
          MAVEN_GOALS: ${{ matrix.suite.goals }}
          JAVA_VERSION: ${{ matrix.java }}

      - name: Diagnose OOM kills
        if: ${{ failure() && steps.tests.conclusion == 'failure' }}
        run: |
          free -m
          sudo dmesg | grep -i -E "killed process|out of memory" || echo "No OOM kills found in dmesg"
          docker ps -a --format '{{.Names}}\t{{.Status}}' || true
          docker inspect --format '{{.Name}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' $(docker ps -aq) 2>/dev/null || true
          echo "::group::Full dmesg"
          sudo dmesg -T || true
          echo "::endgroup::"

      - name: Upload artifacts
        if: ${{ failure() && steps.tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite.name }} - Java ${{ matrix.java }}-ecchronos-logs
          path: ./ecchronos-binary/target/test/ecchronos-binary-agent-*/logs/
          if-no-files-found: 'ignore'
