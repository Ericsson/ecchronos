name: Test report

on:
  workflow_dispatch:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

env:
  MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

permissions: read-all

jobs:
  tests:
    # Each job runs on JDK ${{ matrix.java }} and compiles to the matching
    # bytecode target (-Djava.version=${{ matrix.java }}). Runtime and target are
    # paired, so we test exactly: JDK 17 -> target 17 and JDK 21 -> target 21.
    name: "${{ matrix.suite.name }} - Java ${{ matrix.java }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        suite:
          - name: "Unit tests"
            goals: 'test jacoco:report'
          - name: "Style check"
            goals: 'test-compile com.mycila:license-maven-plugin:check pmd:pmd pmd:cpd pmd:check pmd:cpd-check javadoc:jar'
          - name: "Standalone integration 4.1"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=4.1 -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Standalone integration 5.0"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=5.0 -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Standalone integration 6.0"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=6.0 -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Python integration"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=6.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Topology integration"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=6.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "DatacenterAware Multi-Agent integration tests"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=6.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Incremental Repair integration tests"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=6.0 -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Standalone integration"
            goals: 'verify -P standalone-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "standalone-integration/target"
          - name: "Jolokia Python integration 5.0"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=5.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Python integration"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Python integration - PEM"
            goals: 'verify -P python-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Topology integration"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Topology integration - PEM"
            goals: 'verify -P topology-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia DatacenterAware Multi-Agent integration tests"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia DatacenterAware Multi-Agent integration tests - PEM"
            goals: 'verify -P multi-agent-datacenter-aware-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Incremental Repair integration tests"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"
          - name: "Jolokia Incremental Repair integration tests - PEM"
            goals: 'verify -P incremental-repair-integration-tests -Dit.cassandra.version=6.0 -Dit.jolokia.enabled=true -Dit.jmx.pem.enabled=true -DskipUTs'
            artifacts_dir: "ecchronos-binary/target"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: build-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ runner.os }}-maven-

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install black
        run: python -m pip install black==24.10.0

      - name: Run black in the check mode
        run: black --check --verbose --line-length 120 ./ecchronos-binary/src

      - name: install dependencies
        run: mvn install -Pbuild-cassandra-test-jar -DskipTests=true

      - name: Set Cassandra memory limits for topology tests
        if: contains(matrix.suite.name, 'Topology')
        run: |
          echo "MAX_HEAP_SIZE=1536M" >> $GITHUB_ENV
          echo "HEAP_NEWSIZE=200M" >> $GITHUB_ENV

      - name: Set up Docker Compose
        uses: KengoTODA/actions-setup-docker-compose@b09fb2b902df45b91982bc46858188f2a714ee5f # v1.2.11
        with:
          version: '2.31.0'

      # Runs on JDK ${{ matrix.java }}; -Djava.version sets the matching bytecode
      # target. net.bytebuddy.experimental=true lets Mockito/ByteBuddy run on JDK 21.
      - run: mvn $MAVEN_GOALS -Djava.version=$JAVA_VERSION -Dnet.bytebuddy.experimental=true -B
        id: tests
        env:
          MAVEN_GOALS: ${{ matrix.suite.goals }}
          JAVA_VERSION: ${{ matrix.java }}

      - name: Upload artifacts
        if: ${{ failure() && steps.tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite.name }} - Java ${{ matrix.java }}-ecchronos-logs
          path: ./ecchronos-binary/target/test/ecchronos-binary-agent-*/logs/
          if-no-files-found: 'ignore'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: >
            ./rest/target/site/jacoco/jacoco.xml,
            ./application/target/site/jacoco/jacoco.xml,
            ./core/target/site/jacoco/jacoco.xml,
            ./fault.manager.impl/target/site/jacoco/jacoco.xml,
            ./connection.impl/target/site/jacoco/jacoco.xml,
            ./core.impl/target/site/jacoco/jacoco.xml,
            ./data/target/site/jacoco/jacoco.xml,
            ./utils/target/site/jacoco/jacoco.xml
