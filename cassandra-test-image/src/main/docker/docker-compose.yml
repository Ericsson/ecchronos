      - CASSANDRA_PASSWORD_SEEDER=yes
      - CASSANDRA_PASSWORD=cassandra
      - MAX_HEAP_SIZE=${MAX_HEAP_SIZE:-3G}
      - HEAP_NEWSIZE=${HEAP_NEWSIZE:-400M}
      - LOCAL_JMX=no
      - JOLOKIA=${JOLOKIA}
      - PEM_ENABLED=${PEM_ENABLED}
      # NOTE: superuser_setup_delay_ms is intentionally NOT set to 0. The default (10s)
      # lets gossip/ring establish before CassandraRoleManager seeds the default
      # 'cassandra' superuser, so exactly one node creates the role and the others read
      # it. Forcing 0 made every node seed its own role row in isolation; after the
      # system_auth RF increase (ALTER to {dc1:1, dc2:2}) a QUORUM read of the role could
      # miss a majority-consistent row, surfacing as a persistent "[Bad credentials]
